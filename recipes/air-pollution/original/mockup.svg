<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .slide { fill: #FFFFFF; stroke: #E8E8E8; stroke-width: 2; }
      .title { font-family: 'Century Gothic', 'Futura', 'Avenir Next', 'Avant Garde', sans-serif; font-weight: 700; fill: #0A0A0A; }
      .subtitle { font-family: 'Century Gothic', 'Futura', 'Avenir Next', 'Avant Garde', sans-serif; font-weight: 400; fill: #333333; }
      .body { font-family: Georgia, 'Times New Roman', serif; fill: #0A0A0A; }
      .muted { font-family: 'Century Gothic', 'Futura', 'Avenir Next', 'Avant Garde', sans-serif; fill: #888888; }
      .rule { stroke: #E8E8E8; stroke-width: 2; }
      .arrow-solid { fill: #0A0A0A; }
    </style>
  </defs>

  <!-- Title page mockup -->
  <rect x="40" y="40" width="720" height="405" class="slide"/>
  <!-- Title -->
  <text x="400" y="235" text-anchor="middle" class="title" font-size="28">Black–White Sharp Academic Template</text>
  <!-- Subtitle -->
  <text x="400" y="268" text-anchor="middle" class="subtitle" font-size="14">A clean, mathematical, monochrome presentation style</text>
  <!-- Meta -->
  <text x="400" y="340" text-anchor="middle" class="body" font-size="13">Presenter Name</text>
  <text x="400" y="360" text-anchor="middle" class="muted" font-size="11">Department or Institution</text>
  <text x="400" y="378" text-anchor="middle" class="muted" font-size="11">August 6, 2026</text>

  <!-- Content slide mockup -->
  <rect x="840" y="40" width="720" height="405" class="slide"/>
  <!-- Frame title -->
  <text x="870" y="85" class="title" font-size="20">Motivation</text>
  <line x1="870" y1="95" x2="1540" y2="95" class="rule"/>
  <!-- Bullets (sharp chevron arrows) -->
  <g transform="translate(870,140)">
    <polygon points="0,0 7,6 0,12 2.5,6" class="arrow-solid"/>
    <text x="22" y="9" class="body" font-size="14">Strict black-and-white palette, no color noise.</text>
  </g>
  <g transform="translate(870,175)">
    <polygon points="0,0 7,6 0,12 2.5,6" class="arrow-solid"/>
    <text x="22" y="9" class="body" font-size="14">Sharp geometric sans headings with math support.</text>
  </g>
  <g transform="translate(870,210)">
    <polygon points="0,0 7,6 0,12 2.5,6" class="arrow-solid"/>
    <text x="22" y="9" class="body" font-size="14">Arrow bullets and a clean geometric motif.</text>
  </g>
  <g transform="translate(870,245)">
    <polygon points="0,0 7,6 0,12 2.5,6" class="arrow-solid"/>
    <text x="22" y="9" class="body" font-size="14">Generous whitespace and clear hierarchy.</text>
  </g>
  <!-- Block mockup -->
  <rect x="870" y="290" width="670" height="80" fill="#E8E8E8"/>
  <rect x="870" y="290" width="670" height="26" fill="#0A0A0A"/>
  <text x="880" y="308" class="subtitle" font-size="12" fill="#FFFFFF">Theorem (Consistency)</text>
  <text x="880" y="335" class="body" font-size="13">Under standard regularity conditions, the estimator converges.</text>
  <!-- Page number -->
  <text x="1525" y="425" text-anchor="end" class="muted" font-size="11">5</text>

  <!-- Section divider mockup (bottom left) -->
  <rect x="40" y="490" width="720" height="405" class="slide"/>
  <!-- thin rules above and below title -->
  <line x1="200" y1="640" x2="600" y2="640" class="rule"/>
  <text x="400" y="700" text-anchor="middle" class="title" font-size="26">Mathematical content</text>
  <line x1="200" y1="760" x2="600" y2="760" class="rule"/>

  <!-- Equation slide mockup (bottom right) -->
  <rect x="840" y="490" width="720" height="405" class="slide"/>
  <text x="870" y="535" class="title" font-size="20">Equations</text>
  <line x1="870" y1="545" x2="1540" y2="545" class="rule"/>
  <text x="880" y="590" class="body" font-size="16">Latin Modern math font keeps formulas consistent:</text>
  <rect x="900" y="620" width="640" height="70" fill="#F5F5F5" rx="3"/>
  <text x="1220" y="660" text-anchor="middle" class="body" font-size="16" font-style="italic">min</text>
  <text x="1250" y="665" class="body" font-size="12">x ∈ ℝⁿ</text>
  <text x="1290" y="662" class="body" font-size="16">f(x)  subject to  gᵢ(x) ≤ 0</text>
  <text x="880" y="740" class="body" font-size="16">OLS estimator:</text>
  <rect x="900" y="760" width="640" height="50" fill="#F5F5F5" rx="3"/>
  <text x="1220" y="790" text-anchor="middle" class="body" font-size="17" font-style="italic">β̂ = (XᵀX)⁻¹Xᵀy</text>
  <text x="1525" y="875" text-anchor="end" class="muted" font-size="11">7</text>
</svg>
